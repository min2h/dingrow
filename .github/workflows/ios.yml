name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "iosApp/**"
      - "shared/**"
      - "composeApp/src/commonMain/**"
      - "composeApp/src/iosMain/**"
      - "composeApp/build.gradle.kts"
      - "shared/build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # publish the simulator .app zip as the rolling "ios-sim" pre-release

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore Kotlin/Native toolchain
        id: konan
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Android SDK is not needed for the iOS frameworks; local.properties only silences AGP.
      - name: local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-$HOME/Library/Android/sdk}" > local.properties

      - name: Build KMP frameworks (simulator arm64)
        run: ./gradlew --stacktrace :shared:linkDebugFrameworkIosSimulatorArm64 :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Resolve Swift packages
        working-directory: iosApp
        run: xcodebuild -resolvePackageDependencies -project iosApp.xcodeproj -scheme iosApp || true

      # Firebase is optional: without GoogleService-Info.plist the app skips FirebaseApp.configure().
      - name: xcodebuild (iphonesimulator, Debug, unsigned)
        working-directory: iosApp
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: unable|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

      - name: Show compile errors
        if: failure()
        working-directory: iosApp
        run: |
          grep -E -B2 -A6 "error:" build/xcodebuild.log | head -300 || true
          # Print the generated ObjC header lines the errors point at (Kotlin API names that clash with C/ObjC).
          grep -oE '[^ ]+\.h:[0-9]+' build/xcodebuild.log | sort -u | head -20 | while IFS=: read -r f l; do
            echo "== $f:$l"; sed -n "$((l-6)),$((l+2))p" "$f"; done || true

      - name: Save Kotlin/Native toolchain
        if: always() && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}

      - name: Zip .app
        working-directory: iosApp/build/dd/Build/Products/Debug-iphonesimulator
        run: ditto -c -k --sequesterRsrc --keepParent "$(ls -d *.app | grep -v PetWidget | head -1)" "$GITHUB_WORKSPACE/Dingrow-sim.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Dingrow-simulator
          path: Dingrow-sim.zip
          retention-days: 14

      - name: Publish rolling pre-release (ios-sim)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-sim --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-sim Dingrow-sim.zip --prerelease --target "$GITHUB_SHA" \
            --title "iOS simulator build ${GITHUB_SHA::7}" --notes "Unsigned Debug iphonesimulator build (arm64)."

      - name: Upload to Appetize (optional)
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_IOS_KEY: ${{ vars.APPETIZE_IOS_KEY }}
        if: env.APPETIZE_API_TOKEN != '' && env.APPETIZE_IOS_KEY != ''
        run: |
          curl -sf -X POST -H "X-API-KEY: $APPETIZE_API_TOKEN" -F "file=@Dingrow-sim.zip" -F "platform=ios" \
            "https://api.appetize.io/v1/apps/$APPETIZE_IOS_KEY" -o /dev/null && echo "Appetize updated"
